{% load storefront %}{% comment %}Ports SkinQuizBanner in Home.tsx.{% endcomment %}
<section class="mx-auto max-w-7xl px-4 py-8 md:py-12">
  <div class="relative overflow-hidden rounded-[var(--radius-lg)] bg-[var(--color-brand-secondary)] px-6 py-10 text-white md:px-12 md:py-14">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 opacity-70" style="background: radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,0.16), transparent 60%)"></div>
    <div class="relative flex flex-col items-start gap-5 text-start md:flex-row md:items-center md:justify-between md:gap-10">
      <div class="max-w-xl">
        <p class="text-xs font-semibold text-white/70 {% if not is_ar %}uppercase tracking-[0.14em]{% endif %}">{% t 'home.quizBannerEyebrow' %}</p>
        <h2 class="mt-2 font-display text-2xl font-semibold tracking-tight md:text-[2rem]">{% t 'home.quizBannerTitle' %}</h2>
        <p class="mt-2 text-sm text-white/85 md:text-base">{% t 'home.quizBannerBody' %}</p>
      </div>
      <a href="{% url 'storefront:skin_quiz' %}"
        class="inline-flex w-fit shrink-0 items-center gap-2 rounded-[var(--radius-sm)] bg-white px-5 py-2.5 text-sm font-semibold text-[var(--color-brand-secondary)] shadow-[var(--shadow-md)] transition-transform duration-150 hover:scale-[1.03] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--color-brand-secondary)]">
        {% t 'home.quizBannerCta' %}{% include "storefront/partials/_arrow_end.html" %}
      </a>
    </div>
  </div>
</section>
