{% load storefront %}{% comment %}Confirmation line under the PDP add-to-cart form (htmx target #pdp-atc-msg).{% endcomment %}
<span id="pdp-atc-msg" class="mt-2.5 flex items-center gap-1.5 text-sm text-[var(--color-success)]">
  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8.5 3.2 3.2L13 5"/></svg>
  {% t 'product.inCart' %} · <a href="{% url 'storefront:cart' %}" class="font-medium underline">{{ in_cart_qty }}</a>
</span>
